[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvos-windows-llm-ui"
version = "0.1.0"
description = "Windows LLM interface layer app (pywebview + FastAPI) with Windows-Use hands and Mistral inference."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "MarvOS" }]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pywebview>=5.1",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.9",
  "platformdirs>=4.2.0",
  "Pillow>=10.3.0",
  "mistralai[realtime]>=1.0.0",
  "playwright>=1.41.0",
]

[project.optional-dependencies]
windows = [
  "uiautomation>=2.0.29",
  "fuzzywuzzy>=0.18.0",
  "pyautogui>=0.9.54",
  "pywin32>=306",
]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
